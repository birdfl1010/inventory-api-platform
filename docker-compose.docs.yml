services:
  docs:
    image: inventory_stock_management_local_docs
    container_name: inventory_stock_management_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./inventory_stock_management:/app/inventory_stock_management:z
    ports:
      - '9000:9000'
    command: /start-docs
