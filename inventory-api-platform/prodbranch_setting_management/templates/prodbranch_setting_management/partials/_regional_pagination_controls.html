<div id="regional-stock-list-pagination"
     class="d-flex justify-content-center mt-2">
  <nav aria-label="Page navigation">
    <ul class="pagination pagination-sm">
      <!-- First Page -->
      <li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">
        <a class="page-link small"
           hx-get="{% url 'prodbranch_setting_management:load_regional_stock_list_rows' region_slug=region.slug %}?page=1"
           hx-target="#regional-stock-list-rows"
           hx-swap="outerHTML"
           hx-push-url="false"
           hx-on::after-request="htmx.ajax('GET', '{% url 'prodbranch_setting_management:load_regonal_stock_list_pagination_controls' region_slug=region.slug %}?page=1', {target: '#regional-stock-list-pagination', swap: 'outerHTML'})">
          First
        </a>
      </li>
      <!-- Previous Page -->
      <li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">
        <a class="page-link small"
           hx-get="{% url 'prodbranch_setting_management:load_regional_stock_list_rows' region_slug=region.slug %}?page={{ previous_page }}"
           hx-target="#regional-stock-list-rows"
           hx-swap="outerHTML"
           hx-push-url="false"
           hx-on::after-request="htmx.ajax('GET', '{% url 'prodbranch_setting_management:load_regonal_stock_list_pagination_controls' region_slug=region.slug %}?page={{ previous_page }}', {target: '#regional-stock-list-pagination', swap: 'outerHTML'})">
          Previous
        </a>
      </li>
      <!-- Page Numbers -->
      {% for num in paginator.page_range %}
        {% if num >= page_obj.number|add:"-2" and num <= page_obj.number|add:"2" and num >= 1 and num <= paginator.num_pages %}
          <li class="page-item {% if num == page_obj.number %}active{% endif %}">
            <a class="page-link small"
               hx-get="{% url 'prodbranch_setting_management:load_regional_stock_list_rows' region_slug=region.slug %}?page={{ num }}"
               hx-target="#regional-stock-list-rows"
               hx-swap="outerHTML"
               hx-push-url="false"
               hx-on::after-request="htmx.ajax('GET', '{% url 'prodbranch_setting_management:load_regonal_stock_list_pagination_controls' region_slug=region.slug %}?page={{ num }}', {target: '#regional-stock-list-pagination', swap: 'outerHTML'})">
              {{ num }}
            </a>
          </li>
        {% endif %}
      {% endfor %}
      <!-- Next Page -->
      <li class="page-item {% if not page_obj.has_next %}disabled{% endif %}">
        <a class="page-link small"
           hx-get="{% url 'prodbranch_setting_management:load_regional_stock_list_rows' region_slug=region.slug %}?page={{ next_page }}"
           hx-target="#regional-stock-list-rows"
           hx-swap="outerHTML"
           hx-push-url="false"
           hx-on::after-request="htmx.ajax('GET', '{% url 'prodbranch_setting_management:load_regonal_stock_list_pagination_controls' region_slug=region.slug %}?page={{ next_page }}', {target: '#regional-stock-list-pagination', swap: 'outerHTML'})">
          Next
        </a>
      </li>
      <!-- Last Page -->
      <li class="page-item {% if not page_obj.has_next %}disabled{% endif %}">
        <a class="page-link small"
           hx-get="{% url 'prodbranch_setting_management:load_regional_stock_list_rows' region_slug=region.slug %}?page={{ paginator.num_pages }}"
           hx-target="#regional-stock-list-rows"
           hx-swap="outerHTML"
           hx-push-url="false"
           hx-on::after-request="htmx.ajax('GET', '{% url 'prodbranch_setting_management:load_regonal_stock_list_pagination_controls' region_slug=region.slug %}?page={{ paginator.num_pages }}', {target: '#regional-stock-list-pagination', swap: 'outerHTML'})">
          Last
        </a>
      </li>
    </ul>
  </nav>
</div>
