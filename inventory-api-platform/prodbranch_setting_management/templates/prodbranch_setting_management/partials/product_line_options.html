{% for line in results %}
  {% if line_type == 'buy_line' %}
    <a href="#"
       class="dropdown-item"
       onclick=" document.getElementById('buy_line-search').value = '{{ line.line }}'; document.getElementById('buy_line-options').innerHTML = ''; var searchVal = encodeURIComponent(document.getElementById('search-input').value); var reviewVal = encodeURIComponent(document.getElementById('review-filter').value); var buyLineVal = encodeURIComponent(document.getElementById('buy_line-search').value); var priceLineVal = encodeURIComponent(document.getElementById('price_line-search').value); var vapVal = (document.querySelector('input[name=&quot;vap_filter&quot;]:checked') ? document.querySelector('input[name=&quot;vap_filter&quot;]:checked').value : ''); var rslVal = (document.querySelector('input[name=&quot;rsl_filter&quot;]:checked') ? document.querySelector('input[name=&quot;rsl_filter&quot;]:checked').value : ''); var sortFieldVal = encodeURIComponent(document.querySelector('#sort-field').value); var sortDirectionVal = encodeURIComponent(document.querySelector('#sort-direction').value); var rowsUrl = '{% url "prodbranch_setting_management:load_formset_rows" branch.pk %}?search_query=' + searchVal + '&review_filter=' + reviewVal + '&buy_line_filter=' + buyLineVal + '&price_line_filter=' + priceLineVal + '&vap_filter=' + vapVal + '&rsl_filter=' + rslVal + '&sort_field=' + sortFieldVal + '&sort_direction=' + sortDirectionVal; var pagUrl = '{% url "prodbranch_setting_management:load_pagination_controls" branch.pk %}?search_query=' + searchVal + '&review_filter=' + reviewVal + '&buy_line_filter=' + buyLineVal + '&price_line_filter=' + priceLineVal + '&vap_filter=' + vapVal + '&rsl_filter=' + rslVal + '&sort_field=' + sortFieldVal + '&sort_direction=' + sortDirectionVal; var appliedUrl = '{% url "prodbranch_setting_management:load_applied_filters" %}?search_query=' + searchVal + '&review_filter=' + reviewVal + '&buy_line_filter=' + buyLineVal + '&price_line_filter=' + priceLineVal + '&vap_filter=' + vapVal + '&rsl_filter=' + rslVal + '&sort_field=' + sortFieldVal + '&sort_direction=' + sortDirectionVal; htmx.ajax('GET', rowsUrl, {target: '#setting-list', swap: 'outerHTML'}) .then(function(){ return htmx.ajax('GET', appliedUrl, {target: '#applied-filters', swap: 'outerHTML'}); }) .then(function(){ htmx.ajax('GET', pagUrl, {target: '#pagination-controls', swap: 'outerHTML'}); }); return false; ">
      {{ line.line }}
    </a>
  {% else %}
    <a href="#"
       class="dropdown-item"
       onclick=" document.getElementById('price_line-search').value = '{{ line.line }}'; document.getElementById('price_line-options').innerHTML = ''; var searchVal = encodeURIComponent(document.getElementById('search-input').value); var reviewVal = encodeURIComponent(document.getElementById('review-filter').value); var buyLineVal = encodeURIComponent(document.getElementById('buy_line-search').value); var priceLineVal = encodeURIComponent(document.getElementById('price_line-search').value); var vapVal = (document.querySelector('input[name=&quot;vap_filter&quot;]:checked') ? document.querySelector('input[name=&quot;vap_filter&quot;]:checked').value : ''); var rslVal = (document.querySelector('input[name=&quot;rsl_filter&quot;]:checked') ? document.querySelector('input[name=&quot;rsl_filter&quot;]:checked').value : ''); var sortFieldVal = encodeURIComponent(document.querySelector('#sort-field').value); var sortDirectionVal = encodeURIComponent(document.querySelector('#sort-direction').value); var rowsUrl = '{% url "prodbranch_setting_management:load_formset_rows" branch.pk %}?search_query=' + searchVal + '&review_filter=' + reviewVal + '&buy_line_filter=' + buyLineVal + '&price_line_filter=' + priceLineVal + '&vap_filter=' + vapVal + '&rsl_filter=' + rslVal + '&sort_field=' + sortFieldVal + '&sort_direction=' + sortDirectionVal; var pagUrl = '{% url "prodbranch_setting_management:load_pagination_controls" branch.pk %}?search_query=' + searchVal + '&review_filter=' + reviewVal + '&buy_line_filter=' + buyLineVal + '&price_line_filter=' + priceLineVal + '&vap_filter=' + vapVal + '&rsl_filter=' + rslVal + '&sort_field=' + sortFieldVal + '&sort_direction=' + sortDirectionVal; var appliedUrl = '{% url "prodbranch_setting_management:load_applied_filters" %}?search_query=' + searchVal + '&review_filter=' + reviewVal + '&buy_line_filter=' + buyLineVal + '&price_line_filter=' + priceLineVal + '&vap_filter=' + vapVal + '&rsl_filter=' + rslVal + '&sort_field=' + sortFieldVal + '&sort_direction=' + sortDirectionVal; htmx.ajax('GET', rowsUrl, {target: '#setting-list', swap: 'outerHTML'}) .then(function(){ return htmx.ajax('GET', appliedUrl, {target: '#applied-filters', swap: 'outerHTML'}); }) .then(function(){ htmx.ajax('GET', pagUrl, {target: '#pagination-controls', swap: 'outerHTML'}); }); return false; ">
      {{ line.line }}
    </a>
  {% endif %}
{% endfor %}
